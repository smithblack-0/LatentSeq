name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install '.[test]'
      - name: Compile source
        run: python -m compileall -q src
      - name: Run CPU-certifiable tests
        run: python -m pytest -m 'not cuda'

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install build frontend
        run: python -m pip install build
      - name: Build distributions
        run: python -m build
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Smoke-test installed package
        run: |
          cd "$(mktemp -d)"
          python - <<'PY'
          import latentseq
          from latentseq import Agent, Generator, Language, Vocabulary, validate_compatibility

          assert latentseq.__name__ == "latentseq"
          assert all((Agent, Language, Vocabulary, Generator, validate_compatibility))
          PY
