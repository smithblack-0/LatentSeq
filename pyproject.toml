[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "latentseq"
version = "0.1.0"
description = "Configurable latent-observable sequential process generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "torch>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "build>=1.2"]

[project.urls]
Repository = "https://github.com/smithblack-0/LatentSeq"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "cuda: requires a CUDA backend",
    "compile: exercises torch.compile behavior",
]
